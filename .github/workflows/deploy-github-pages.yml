name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # 数据更新 workflow 用 GITHUB_TOKEN push 的 commit 不会触发 on:push（防递归），
  # 因此改用 workflow_run 监听其完成事件，确保新数据自动上线。
  workflow_run:
    workflows: ["Update lottery data"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 当由数据 workflow 触发时，仅在其成功完成后才部署
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify
        run: npm test

      - name: Build static site
        run: |
          mkdir -p site
          cp -R public/. site/
          cp -R src site/src
          cp -R data site/data
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
