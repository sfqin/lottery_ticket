<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d2530" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="选号助手" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>大乐透/双色球智能选号助手</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260614-cache-buster" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero__text">
          <p class="eyebrow">18+ 理性使用</p>
          <h1 id="page-title">大乐透/双色球智能选号助手</h1>
          <p class="hero__copy">
            提供号码生成、历史数据参考与组合解释。仅供娱乐参考，不销售彩票，不代购，不出票。
          </p>
        </div>
        <div class="notice-strip" id="required-notices"></div>
      </section>

      <section class="workspace-grid" aria-label="核心工具">
        <section class="panel ticket-check-panel" aria-label="手动验票辅助">
          <div class="section-heading">
            <span>手动验票</span>
            <strong>仅双色球 / 大乐透</strong>
          </div>

          <div class="segmented" role="group" aria-label="选择验票彩种">
            <button class="segment is-active" data-check-type="ssq" type="button">双色球</button>
            <button class="segment" data-check-type="dlt" type="button">大乐透</button>
          </div>

          <div class="check-form">
            <label class="field">
              <span>开奖期号</span>
              <select id="ticket-issue-select"></select>
            </label>

            <div class="check-fields" id="ticket-check-fields"></div>
            <button class="ghost-action check-action" id="ticket-add-row-button" type="button">添加一注</button>

            <button class="secondary-action check-action" id="check-ticket-button" type="button">
              查询是否命中奖级
            </button>
          </div>

          <div class="check-result is-empty" id="ticket-check-result" aria-live="polite"></div>

          <div class="prize-rules" id="prize-rules"></div>
        </section>

        <section class="panel generator-panel">
          <div class="section-heading">
            <span>选号</span>
            <strong id="remaining-count">不限次数</strong>
          </div>

          <div class="segmented" role="group" aria-label="选择彩种">
            <button class="segment is-active" data-type="ssq" type="button">双色球</button>
            <button class="segment" data-type="dlt" type="button">大乐透</button>
          </div>

          <label class="field">
            <span>生成模式</span>
            <select id="strategy-select">
              <option value="trend" selected>趋势参考</option>
              <option value="balanced">均衡生成</option>
              <option value="random">随机生成</option>
              <option value="data">数据参考</option>
              <option value="theory">分层理论模型</option>
            </select>
          </label>

          <label class="field">
            <span>生成组数</span>
            <select id="generate-count-select">
              <option value="1">1 组</option>
              <option value="3">3 组</option>
              <option value="5" selected>5 组</option>
              <option value="10">10 组</option>
            </select>
          </label>

          <button class="primary-action" id="generate-button" type="button">生成号码</button>

          <div class="ticket-card" id="ticket-card" aria-live="polite">
          </div>

        </section>

        <section class="panel analysis-panel">
          <div class="section-heading">
            <span>开奖数据</span>
            <strong id="latest-issue">以官方公告为准</strong>
          </div>
          <div class="segmented" role="group" aria-label="选择开奖数据彩种">
            <button class="segment is-active" data-analysis-type="ssq" type="button">双色球</button>
            <button class="segment" data-analysis-type="dlt" type="button">大乐透</button>
          </div>
          <div id="latest-draw" class="latest-draw"></div>
          <div id="analysis-summary" class="analysis-summary"></div>
          <div class="redeemable-draws">
            <div class="subsection-heading">
              <b>可兑奖期数</b>
              <span>兑奖有效期 60 个自然日</span>
            </div>
            <div id="redeemable-draw-list"></div>
          </div>
          <p class="fine-print">开奖数据来自公开渠道整理，实际结果以官方公告为准。</p>
        </section>
      </section>

      <section class="panel arena-panel" aria-label="策略擂台">
        <div class="section-heading">
          <span>策略擂台</span>
          <strong>5 策略 · 每策略 5 注</strong>
        </div>
        <div class="segmented" role="group" aria-label="选择策略擂台彩种">
          <button class="segment is-active" data-arena-type="ssq" type="button">双色球</button>
          <button class="segment" data-arena-type="dlt" type="button">大乐透</button>
        </div>
        <div id="arena-list" class="arena-list">
          <p class="muted">正在加载策略擂台数据...</p>
        </div>
      </section>

      <section class="support-dock" aria-label="赞赏">
        <section class="panel appreciation-panel">
          <div class="section-heading">
            <span>赞赏支持</span>
            <strong>自愿</strong>
          </div>
          <p id="appreciation-notice" class="appreciation-copy"></p>
          <div class="appreciation-methods" role="group" aria-label="选择赞赏方式">
            <button class="appreciation-method is-active" data-appreciation-method="wechat" type="button">微信</button>
            <button class="appreciation-method" data-appreciation-method="alipay" type="button">支付宝</button>
          </div>
          <div class="appreciation-codes">
            <figure class="appreciation-code appreciation-code--primary is-active" data-appreciation-code="wechat">
              <img src="zanshang.png" alt="自愿赞赏二维码，谢谢各位支持" />
              <figcaption>
                <b>赞赏码</b>
                <span>微信扫码支持</span>
              </figcaption>
            </figure>
            <figure class="appreciation-code" data-appreciation-code="alipay">
              <img src="zhifubaozanshang.png" alt="支付宝自愿赞赏二维码" />
              <figcaption>
                <b>支付宝赞赏</b>
                <span>支付宝扫码支持</span>
              </figcaption>
            </figure>
          </div>
          <p class="fine-print">赞赏完全自愿。赞赏不增加生成次数，不解锁高级策略，不改变号码结果。</p>
        </section>
      </section>
    </main>

    <script type="module" src="app.js?v=20260614-cache-buster"></script>
  </body>
</html>
